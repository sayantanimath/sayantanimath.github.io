    <!-- Design overrides (same as index.html) -->
    <style>
        :root {
            --accent: #17375E;
            --accent-dark: #0B1F3A;
            --text: #1A1A1A;
            --rule: #D9DEE5;
        }
        html, body {
            background: #ffffff !important;
            background-image: none !important;
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Source Sans 3", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            font-size: 18px;
            line-height: 1.65;
            color: var(--text);
            margin: 0;
        }
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px 48px;
            background: #ffffff !important;
        }

        /* Header */
        header {
            background: #ffffff !important;
            background-image: none !important;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 24px;
            padding: 20px 0 14px;
            margin: 0;
            border-bottom: 1px solid var(--rule);
        }
        header > a { display: none; }

        nav {
            order: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 28px;
            background: none !important;
        }
        nav a,
        nav a:visited {
            text-decoration: none;
            color: var(--accent) !important;
        }
        .navcloud {
            background: none !important;
            box-shadow: none !important;
            border-radius: 0;
            padding: 6px 0;
            font-size: 17px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        nav a:hover .navcloud { border-bottom-color: var(--accent); }

        .header-icons { order: 2; background: none !important; }
        .social {
            display: flex;
            gap: 16px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .social li { margin: 0; padding: 0; }
        .icon-small { width: 24px; height: 24px; display: block; }
        .social a:hover { opacity: 0.75; }

        /* Misc content */
        .misc { padding: 40px 0 0; }
        .misc h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.4rem;
            line-height: 1.2;
            font-weight: 700;
            color: var(--accent);
            text-align: left;
            margin: 0 0 16px;
        }
        .jump {
            margin: 0 0 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .jump a {
            display: inline-block;
            padding: 5px 14px;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
            border: 1.5px solid var(--accent);
            border-radius: 6px;
        }
        .jump a:hover { background: var(--accent); color: #ffffff; }

        .misc section { margin-top: 56px; scroll-margin-top: 16px; }
        .misc h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.6rem;
            line-height: 1.25;
            font-weight: 700;
            color: var(--accent) !important;
            margin: 0 0 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--rule);
        }

        /* Photo grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .gallery figure {
            position: relative;
            margin: 0;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            background: #EEF1F5;
            cursor: pointer;
        }
        .gallery img {
            width: 100%;
            height: 100%;
            object-fit: cover;   /* change to "contain" to show whole image uncropped */
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery figure:hover img { transform: scale(1.03); }

        /* Caption bar that slides up on hover */
        .gallery figcaption {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            padding: 10px 14px;
            background: rgba(11, 31, 58, 0.88);
            color: #ffffff;
            font-size: 15px;
            line-height: 1.4;
            text-align: left;
            opacity: 0;
            transform: translateY(100%);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .gallery figure:hover figcaption,
        .gallery figure:focus-within figcaption {
            opacity: 1;
            transform: translateY(0);
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: rgba(11, 31, 58, 0.94);
        }
        #lightbox.open { display: flex; }
        #lightbox img {
            max-width: 92vw;
            max-height: 76vh;
            border-radius: 6px;
            background: #ffffff;
        }
        #lightbox .lb-cap {
            color: #ffffff;
            font-size: 16px;
            max-width: 720px;
            text-align: center;
        }
        #lightbox button {
            position: absolute;
            background: none;
            border: 0;
            color: #ffffff;
            font-size: 40px;
            line-height: 1;
            padding: 8px 16px;
            cursor: pointer;
            opacity: 0.85;
        }
        #lightbox button:hover { opacity: 1; }
        .lb-close { top: 8px; right: 12px; }
        .lb-prev { left: 4px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 4px; top: 50%; transform: translateY(-50%); }

        @media (max-width: 720px) {
            body { font-size: 17px; }
            header { flex-direction: column; align-items: flex-start; }
            .header-icons { order: 0; }
            .misc { padding-top: 28px; }
            .misc h1 { font-size: 2rem; }
            .misc h2 { font-size: 1.4rem; }
            .misc section { margin-top: 44px; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .gallery figcaption { font-size: 13px; padding: 8px 10px; }
        }

        /* Touch screens can't hover, so always show the captions */
        @media (hover: none) {
            .gallery figcaption { opacity: 1; transform: none; }
        }
    </style>

.construction-banner {

.robot-crew {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 20px;
}

.robot-crew span {
    display: inline-block;
    animation: bob 1.5s ease-in-out infinite alternate;
}

    letter-spacing: 2px;
}

    line-height: 1.6;
}

.status span {
    animation: blink 1s steps(2, start) infinite;
}

.progress-track {
    width: 80%;
    height: 14px;
    margin: 20px auto;
    border: 1px solid #2A6BB2;
    padding: 2px;
}

.progress-fill {
    height: 100%;
    width: 70%;
    background: #8cbaed;
    animation: loading 3s ease-in-out infinite alternate;
}

.footer-message {
    font-size: 0.9rem;
    font-style: italic;
}

@keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-8px); }
}

@keyframes blink {
    to { visibility: hidden; }
}

@keyframes loading {
    from { width: 15%; }
    to   { width: 90%; }
}

@media (prefers-reduced-motion: reduce) {
    .robot-crew span,
    .status span,
    .progress-fill {
        animation: none;
    }
}

<!-- Click-to-enlarge viewer -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" aria-label="Close">&times;</button>
  <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
  <img src="" alt="">
  <div class="lb-cap"></div>
  <button class="lb-next" aria-label="Next photo">&#8250;</button>
</div>

<script>
(function () {
    var box = document.getElementById('lightbox');
    var img = box.querySelector('img');
    var cap = box.querySelector('.lb-cap');
    var items = [], idx = 0;

    function show(i) {
        idx = (i + items.length) % items.length;
        var f = items[idx];
        img.src = f.querySelector('img').src;
        img.alt = f.querySelector('img').alt;
        cap.textContent = f.querySelector('figcaption').textContent;
    }
    function open(figs, i) {
        items = figs;
        show(i);
        box.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function close() {
        box.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.querySelectorAll('.gallery').forEach(function (g) {
        var figs = Array.prototype.slice.call(g.querySelectorAll('figure'));
        figs.forEach(function (f, i) {
            f.addEventListener('click', function () { open(figs, i); });
        });
    });

    box.querySelector('.lb-close').addEventListener('click', close);
    box.querySelector('.lb-prev').addEventListener('click', function () { show(idx - 1); });
    box.querySelector('.lb-next').addEventListener('click', function () { show(idx + 1); });
    box.addEventListener('click', function (e) { if (e.target === box) close(); });
    document.addEventListener('keydown', function (e) {
        if (!box.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft') show(idx - 1);
        if (e.key === 'ArrowRight') show(idx + 1);
    });
})();
</script>
